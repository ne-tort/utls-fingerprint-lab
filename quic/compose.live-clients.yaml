# Overlay for live library+browser Initial capture.
# Usage: ./lab.ps1 live -Client aioquic|curl|chromium|chromiumfresh|firefox|all
#
# Capture stays Go clienthellod (compose.yaml). These services only emit Initials.

services:
  # DNS aliases so clients dial SNI hostnames (curl --resolve cannot take a DNS name).
  capture:
    networks:
      fpnet:
        aliases:
          - aioquic.fp.lab
          - curlquiche.fp.lab
          - chromium.fp.lab
          - chromiumfresh.fp.lab
          - firefox.fp.lab
          - yandex.fp.lab

  emit-aioquic:
    build:
      context: .
      dockerfile: docker/Dockerfile.aioquic
    depends_on: [capture]
    networks: [fpnet]
    command:
      - "--host"
      - "capture"
      - "--port"
      - "4433"
      - "--sni"
      - "aioquic.fp.lab"
    profiles: ["live", "aioquic"]

  # curl+quiche (Cloudflare). Bare capture does not speak H3; Initial still sent.
  emit-curl-quiche:
    image: alpine/curl-http3:latest
    depends_on: [capture]
    networks: [fpnet]
    entrypoint: ["curl"]
    command:
      - "--http3-only"
      - "--connect-timeout"
      - "3"
      - "-k"
      - "https://curlquiche.fp.lab:4433/"
    profiles: ["live", "curl"]

  # Headless Chromium hangs on failed H3 (capture is dump-only). Wrap with timeout.
  # zenika/alpine-chrome is often older Chromium — TP ≠ chromeparrot (see RESULTS_MATRIX).
  emit-chromium-h3:
    image: zenika/alpine-chrome:latest
    depends_on: [capture]
    networks: [fpnet]
    shm_size: "256mb"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        timeout 25 chromium-browser --headless=new --no-sandbox --disable-gpu
        --enable-quic --quic-version=h3
        --origin-to-force-quic-on=chromium.fp.lab:4433
        --ignore-certificate-errors
        https://chromium.fp.lab:4433/ || true
    profiles: ["live", "chromium"]

  # Newer Chromium (chromedp headless-shell) for freshness vs zenika alpine.
  emit-chromium-fresh:
    image: chromedp/headless-shell:latest
    depends_on: [capture]
    networks: [fpnet]
    shm_size: "256mb"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        timeout 30 headless-shell --no-sandbox --disable-gpu
        --enable-quic --quic-version=h3
        --origin-to-force-quic-on=chromiumfresh.fp.lab:4433
        --ignore-certificate-errors
        https://chromiumfresh.fp.lab:4433/ || true
    profiles: ["live", "chromiumfresh"]

  emit-firefox-h3:
    build:
      context: ./emitters/firefox
    depends_on: [capture]
    networks: [fpnet]
    shm_size: "1gb"
    profiles: ["live", "firefox"]

  emit-yandex-h3:
    build:
      context: ./emitters/yandex
    depends_on: [capture]
    networks: [fpnet]
    shm_size: "512mb"
    profiles: ["live", "yandex"]
