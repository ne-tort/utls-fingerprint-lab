# Overlay for live library+browser Initial capture.
# Usage: ./lab.ps1 live -Client aioquic|curl|chromium|all
#
# Capture stays Go clienthellod (compose.yaml). These services only emit Initials.

services:
  # DNS aliases so clients dial SNI hostnames (curl --resolve cannot take a DNS name).
  capture:
    networks:
      fpnet:
        aliases:
          - aioquic.fp.lab
          - curlquiche.fp.lab
          - chromium.fp.lab

  emit-aioquic:
    build:
      context: .
      dockerfile: docker/Dockerfile.aioquic
    depends_on: [capture]
    networks: [fpnet]
    command:
      - "--host"
      - "capture"
      - "--port"
      - "4433"
      - "--sni"
      - "aioquic.fp.lab"
    profiles: ["live", "aioquic"]

  # curl+quiche (Cloudflare). Bare capture does not speak H3; Initial still sent.
  emit-curl-quiche:
    image: alpine/curl-http3:latest
    depends_on: [capture]
    networks: [fpnet]
    entrypoint: ["curl"]
    command:
      - "--http3-only"
      - "--connect-timeout"
      - "3"
      - "-k"
      - "https://curlquiche.fp.lab:4433/"
    profiles: ["live", "curl"]

  emit-chromium-h3:
    image: zenika/alpine-chrome:latest
    depends_on: [capture]
    networks: [fpnet]
    shm_size: "256mb"
    entrypoint: ["chromium-browser"]
    command:
      - "--headless=new"
      - "--no-sandbox"
      - "--disable-gpu"
      - "--enable-quic"
      - "--quic-version=h3"
      - "--origin-to-force-quic-on=chromium.fp.lab:4433"
      - "--ignore-certificate-errors"
      - "https://chromium.fp.lab:4433/"
    profiles: ["live", "chromium"]
