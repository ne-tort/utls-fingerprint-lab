# QUIC Initial fingerprint lab — reproducible Docker matrix.
# Prerequisites: ./scripts/build-emitters.ps1 (from Windows/Linux host with Go).

name: quic-fp-lab

services:
  capture:
    build:
      context: .
      dockerfile: docker/Dockerfile.capture
    volumes:
      - ./captures:/captures
      - ./profiles:/profiles
    ports:
      - "4433:4433/udp"
    networks: [fpnet]
    command:
      - "-listen=:4433"
      - "-out=/captures"
      - "-profiles=/profiles"
      - "-default-target=unknown"
      - "-promote=true"
      - "-gather-idle=1200ms"

  # sagernet ChromeParrot (same stack as hy2 default parrot)
  emit-chromeparrot:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-chromeparrot:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "chromeparrot.fp.lab", "-chrome-parrot"]
    profiles: ["emit", "chromeparrot", "matrix"]

  emit-quicgo-plain:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-chromeparrot:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "quicgo.fp.lab", "-chrome-parrot=false"]
    profiles: ["emit", "quicgo", "matrix"]

  emit-uquic-chrome146:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquic146.fp.lab", "-preset", "chrome-146"]
    profiles: ["emit", "uquic", "matrix"]

  emit-uquic-chrome115:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquic115.fp.lab", "-preset", "chrome-115"]
    profiles: ["emit", "uquic", "matrix"]

  emit-uquic-firefox116:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquicff.fp.lab", "-preset", "firefox-116"]
    profiles: ["emit", "uquic", "matrix"]

  # uquic Firefox 116A/B/C variants (TP/CH noise slots)
  emit-uquic-firefox116a:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquicffa.fp.lab", "-preset", "firefox-116a"]
    profiles: ["emit", "uquic", "matrix-ext"]

  emit-uquic-firefox116b:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquicffb.fp.lab", "-preset", "firefox-116b"]
    profiles: ["emit", "uquic", "matrix-ext"]

  emit-uquic-firefox116c:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquicffc.fp.lab", "-preset", "firefox-116c"]
    profiles: ["emit", "uquic", "matrix-ext"]

  # Plain quic-go + RFC 9221 datagrams (= hy2/tuic without parrot)
  emit-quicgo-datagram:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-chromeparrot:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "quicgodg.fp.lab", "-chrome-parrot=false", "-datagrams"]
    profiles: ["emit", "quicgo", "matrix-ext"]

  # Python aioquic library persona
  emit-aioquic:
    build:
      context: ./emitters/aioquic
    depends_on: [capture]
    networks: [fpnet]
    command: ["--host", "capture", "--port", "4433", "--sni", "aioquic.fp.lab"]
    profiles: ["emit", "libs", "matrix"]

  # Roundtrip: second chromeparrot dial with distinct SNI
  emit-chromeparrot-b:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-chromeparrot:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "chromeparrot-b.fp.lab", "-chrome-parrot"]
    profiles: ["roundtrip"]

  emit-uquic146-b:
    image: debian:bookworm-slim
    depends_on: [capture]
    volumes:
      - ./bin/emit-uquic:/emit:ro
    networks: [fpnet]
    entrypoint: ["/emit"]
    command: ["-host", "capture", "-port", "4433", "-sni", "uquic146-b.fp.lab", "-preset", "chrome-146"]
    profiles: ["roundtrip"]

networks:
  fpnet:
    driver: bridge
