# QUIC Initial fingerprint targets (sibling to parent targets.yaml).
# status: active | wishlist | skip
#
# Matrix: ./lab.ps1 matrix | matrix-ext
# Live:   ./lab.ps1 live -Client aioquic|curl|chromium|chromiumfresh|firefox|all
# Product: ./lab.ps1 hy2 | tuic

version: 1

defaults:
  dial_udp: "capture:4433"
  profile_format: "quic-raw-initial-v1"

groups:
  matrix: { description: "Docker matrix emitters (lab.ps1 matrix)" }
  matrix_ext: { description: "Extended emitters (lab.ps1 matrix-ext)" }
  live: { description: "compose.live-clients library/browser clients" }
  browsers: { description: "Real browsers H3" }
  parrot: { description: "sing-box-lx hy2 / tuic outbound" }
  libs: { description: "Other QUIC stacks (wishlist)" }

targets:
  - id: chromeparrot
    group: matrix
    status: active
    family: chrome
    notes: "emit-chromeparrot ≈ hy2/tuic default; fixtures/matrix-20260815"

  - id: quicgo
    group: matrix
    status: active
    family: quic-go
    notes: "emit-quicgo-plain; NO 0x20 (no EnableDatagrams)"

  - id: quicgodg
    group: matrix_ext
    status: active
    family: quic-go
    notes: "EnableDatagrams; expect ≡ hy2plain; see F-HY2PLAIN_DATAGRAM_0x20"

  - id: uquic-chrome-146
    group: matrix
    status: active
    family: chrome
    version: 146
    notes: "uquic QUICChrome_146; not drop-in for sagernet parrot (no 0x11)"

  - id: uquic-chrome-115
    group: matrix
    status: active
    family: chrome
    version: 115
    notes: "stale vs 146; regression only"

  - id: uquic-firefox-116
    group: matrix
    status: active
    family: firefox
    version: 116
    notes: "uquic QUICFirefox_116 reference"

  - id: uquic-firefox-116a
    group: matrix_ext
    status: active
    family: firefox
    version: 116
    notes: "QUICFirefox_116A"

  - id: uquic-firefox-116b
    group: matrix_ext
    status: active
    family: firefox
    version: 116
    notes: "QUICFirefox_116B"

  - id: uquic-firefox-116c
    group: matrix_ext
    status: active
    family: firefox
    version: 116
    notes: "QUICFirefox_116C"

  - id: aioquic
    group: live
    status: active
    family: aioquic
    notes: "lab.ps1 live -Client aioquic; match_only; 0x11 without 0x3128"

  - id: curlquiche
    group: live
    status: active
    family: quiche
    notes: "lab.ps1 live -Client curl; SNI curlquiche.fp.lab; match_only"

  - id: chromium
    group: live
    status: active
    family: chrome
    track: latest
    notes: "zenika alpine; ≠ chromeparrot (0x4752, no 0x11/0x3128)"

  - id: chromiumfresh
    group: live
    status: active
    family: chrome
    track: latest
    notes: "chromedp/headless-shell; freshness vs zenika + parrot"

  - id: firefox
    group: browsers
    status: active
    family: firefox
    track: latest
    notes: "lab.ps1 live -Client firefox; vs uquicff"

  - id: edge-h3
    group: browsers
    status: wishlist
    family: chrome
    notes: "expect alias to chromiumfresh unless TP differs"

  - id: hy2-parrot
    group: parrot
    status: active
    family: chrome
    notes: "lab.ps1 hy2; ≡ chromeparrot"

  - id: hy2-plain
    group: parrot
    status: active
    family: quic-go
    notes: "+0x20 datagram; study F-HY2PLAIN_DATAGRAM_0x20; ≡ quicgodg"

  - id: tuic-parrot
    group: parrot
    status: active
    family: chrome
    notes: "lab.ps1 tuic; expect ≡ chromeparrot/hy2parrot"

  - id: tuic-plain
    group: parrot
    status: active
    family: quic-go
    notes: "lab.ps1 tuic; expect ≡ hy2plain"

  - id: ngtcp2
    group: libs
    status: wishlist
    family: ngtcp2
    notes: "interop image experiment"

  - id: msquic
    group: libs
    status: wishlist
    family: msquic
    notes: "heavy; optional"

  - id: safari-h3
    group: browsers
    status: wishlist
    family: safari
    notes: "macOS host capture only"
