# QUIC Initial fingerprint targets (sibling to parent targets.yaml).
# status: active | wishlist | skip
#
# Matrix emitters (compose --profile matrix) are the reproducible baseline.
# Live browsers / full hy2 outbound JSON — wishlist (see docs/ECOSYSTEM_DESIGN.md).

version: 1

defaults:
  dial_udp: "capture:4433"
  profile_format: "quic-raw-initial-v1"

groups:
  matrix: { description: "Docker matrix emitters (lab.ps1 matrix)" }
  browsers: { description: "Real browsers H3" }
  parrot: { description: "sing-box-lx hy2 / tuic outbound (optional parity)" }
  libraries: { description: "quiche / aioquic / …" }

targets:
  # --- active via compose matrix ---
  - id: chromeparrot
    group: matrix
    status: active
    family: chrome
    version: 0
    track: pinned
    notes: "emit-chromeparrot = sagernet ChromeParrot ≈ hy2 default; fixtures/matrix-20260815"

  - id: quicgo
    group: matrix
    status: active
    family: quic-go
    version: 0
    track: pinned
    notes: "emit-quicgo-plain; hy2 disable_chrome_parrot twin"

  - id: uquic-chrome-146
    group: matrix
    status: active
    family: chrome
    version: 146
    track: pinned
    notes: "uquic QUICChrome_146 (ML-KEM, 2 dg); NOT drop-in for our parrot (no 0x11)"

  - id: uquic-chrome-115
    group: matrix
    status: active
    family: chrome
    version: 115
    track: pinned
    notes: "stale vs 146; regression / observatory compare only"

  - id: uquic-firefox-116
    group: matrix
    status: active
    family: firefox
    version: 116
    track: pinned
    notes: "uquic QUICFirefox_116 reference emit"

  # --- optional hy2 outbound (sing-box binary mount; pattern from demux-quic-auth) ---
  - id: hy2-parrot
    group: parrot
    status: wishlist
    family: chrome
    version: 0
    track: pinned
    notes: "full hy2 outbound → capture:4433; expect ≈ chromeparrot wire; no quic_auth needed for dump"

  - id: hy2-plain
    group: parrot
    status: wishlist
    family: quic-go
    version: 0
    track: pinned
    notes: "hy2 disable_chrome_parrot: true"

  - id: tuic-parrot
    group: parrot
    status: wishlist
    family: chrome
    version: 0
    notes: "same parrot stack as hy2"

  # --- browsers (phase 2) ---
  - id: chromium-h3-latest
    group: browsers
    status: wishlist
    family: chrome
    version: 9999
    track: latest
    notes: "live Chromium H3 freshness vs chromeparrot"

  - id: firefox-h3-latest
    group: browsers
    status: wishlist
    family: firefox
    version: 9999
    track: latest
    notes: "live Firefox vs uquic-firefox-116"

  - id: edge-h3
    group: browsers
    status: wishlist
    family: chrome
    notes: "expect alias to chrome unless TP/CH differs"

  # --- libraries ---
  - id: curl-quiche
    group: libraries
    status: wishlist
    family: quiche
    notes: "curl linked with quiche"

  - id: aioquic
    group: libraries
    status: wishlist
    family: aioquic
    notes: "python-aioquic H3 client"
