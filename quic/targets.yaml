# QUIC Initial fingerprint targets (sibling to parent targets.yaml).
# status: active | wishlist | skip
#
# Matrix emitters (compose --profile matrix) are the reproducible baseline.
# Live clients: ./lab.ps1 live -Client aioquic|curl|chromium|all
#   (compose.yaml + compose.live-clients.yaml)

version: 1

defaults:
  dial_udp: "capture:4433"
  profile_format: "quic-raw-initial-v1"

groups:
  matrix: { description: "Docker matrix emitters (lab.ps1 matrix)" }
  live: { description: "compose.live-clients library/browser clients" }
  browsers: { description: "Real browsers H3 (wishlist)" }
  parrot: { description: "sing-box-lx hy2 / tuic outbound (optional parity)" }

targets:
  - id: chromeparrot
    group: matrix
    status: active
    family: chrome
    notes: "emit-chromeparrot ≈ hy2 default; fixtures/matrix-20260815"

  - id: quicgo
    group: matrix
    status: active
    family: quic-go
    notes: "emit-quicgo-plain"

  - id: uquic-chrome-146
    group: matrix
    status: active
    family: chrome
    version: 146
    notes: "uquic QUICChrome_146; not drop-in for sagernet parrot (no 0x11)"

  - id: uquic-chrome-115
    group: matrix
    status: active
    family: chrome
    version: 115
    notes: "stale vs 146; regression only"

  - id: uquic-firefox-116
    group: matrix
    status: active
    family: firefox
    version: 116
    notes: "uquic QUICFirefox_116 reference"

  - id: aioquic
    group: live
    status: active
    family: aioquic
    notes: "lab.ps1 live -Client aioquic; match_only; 0x11 without 0x3128"

  - id: curlquiche
    group: live
    status: active
    family: quiche
    notes: "lab.ps1 live -Client curl; SNI curlquiche.fp.lab; match_only"

  - id: chromium
    group: live
    status: wishlist
    family: chrome
    track: latest
    notes: "lab.ps1 live -Client chromium; may need image tweaks; freshness vs chromeparrot"

  - id: firefox-h3-latest
    group: browsers
    status: wishlist
    family: firefox
    track: latest
    notes: "live Firefox vs uquic-firefox-116"

  - id: edge-h3
    group: browsers
    status: wishlist
    family: chrome
    notes: "expect alias to chrome unless TP differs"

  - id: hy2-parrot
    group: parrot
    status: wishlist
    family: chrome
    notes: "config/hy2-parrot.json + sing-box bin; expect ≈ chromeparrot"

  - id: hy2-plain
    group: parrot
    status: wishlist
    family: quic-go
    notes: "config/hy2-plain.json"

  - id: tuic-parrot
    group: parrot
    status: wishlist
    family: chrome
    notes: "same parrot stack as hy2"
