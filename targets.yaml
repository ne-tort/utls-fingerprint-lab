# targets.yaml — registry of fingerprint capture targets.
# Extension contract: add an entry here, implement runner (kind), then
# `./lab.ps1 capture -Id <id>` (or capture all). See docs/EXTENDING.md.
#
# status:
#   active   — runnable in this lab, profiles committed when captured
#   wishlist — deferred; see WISHLIST.md
#   skip     — explicitly out of scope
#
# kind:
#   compose          — docker compose run --rm <service>
#   emit-builtin     — tools emit-builtin -id <emit_id>
#   curl-impersonate — lexiforest wrapper inside curl-impersonate image
#   wishlist         — not runnable yet

version: 1

defaults:
  sni_suffix: ".fp.lab.local"
  dial: "capture:8443"
  curl_impersonate_image: "lexiforest/curl-impersonate:alpine"
  profile_format: "utls-raw-clienthello-v1"

groups:
  browsers: { description: "Real browsers in Docker" }
  impersonate: { description: "curl-impersonate browser parrots" }
  builtins: { description: "metacubex/utls Hello*_Auto / version pins" }
  libs: { description: "TLS libraries and language stacks" }
  wishlist: { description: "Deferred targets" }

targets:
  # --- browsers ---
  - id: chromium-stable
    group: browsers
    kind: compose
    service: chromium-stable
    status: active
    needs_dns_alias: true
    utls_ready: true
    notes: "zenika/alpine-chrome:124"

  - id: firefox-release
    group: browsers
